name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          if [ -n "$HF_TOKEN" ] && [ -n "$HF_USERNAME" ]; then
            git config --global user.email "ishanxczsx2023@users.noreply.github.com"
            git config --global user.name "ishanxczsx2023"
            git remote add hf https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/youtube-downloader-web || true
            git push hf main --force
          else
            echo "HF_TOKEN or HF_USERNAME secret is not set yet."
          fi
